[project]
name = "harness"
version = "1.0.0"
description = "Cross-embodiment, cross-VLM benchmark harness (ManiSkill3 + OpenAI-compatible API brains)"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "python-dotenv",
    "pillow",
    "openai",
    "imageio-ffmpeg",
    "opencv-python-headless",
]

[project.optional-dependencies]
sim = ["mani-skill", "gymnasium", "torch"]
dev = ["pytest"]

[project.scripts]
harness = "harness.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["harness*"]
